name: Place Discovery Test

on:
  pull_request:
    paths:
      - "engines/place-discovery.ts"
      - "scripts/place-discovery-test.ts"
      - "package.json"
      - ".github/workflows/place-discovery-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  place-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run place-discovery:test
