name: Developer Portal
on:
  push:
    branches: [codex/release-developer-portal]
  pull_request:
    paths:
      - 'workers/developer-portal/**'
      - 'app/developers/**'
      - 'app/api/v1/spec/**'
      - 'app/api/v1/_lib/tool-spec.ts'
      - 'registry/command-registry.json'
      - 'registry/external-service-catalog.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node workers/developer-portal/build.mjs
      - run: node workers/developer-portal/verify.mjs
