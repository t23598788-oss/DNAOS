name: DNA OS Governance Gate

# Owner, 2026-07-24: the only enforcement that previously existed was a local
# git hook (.git/hooks/pre-commit, DNA-000073) — real, but untracked, and
# bypassable with --no-verify or simply never installed on a given machine.
# This workflow is the second, independent gate: it runs the identical real
# checks (scripts/pre-commit-check.sh) on GitHub itself, on every push and
# PR, so no local bypass or missing hook lets bad registry/architecture state
# reach main unnoticed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Governance guards (registry sync, drift, dead code, duplicates, dependency graph, evidence isolation, registry stub check)
        run: bash scripts/pre-commit-check.sh
