name: DNA OS Governance Gate

# Owner, 2026-07-24: the only enforcement that previously existed was a local
# git hook (.git/hooks/pre-commit, DNA-000073) — real, but untracked, and
# bypassable with --no-verify or simply never installed on a given machine.
# This workflow is the second, independent gate: it runs the identical real
# checks (scripts/pre-commit-check.sh) on GitHub itself, on every push and
# PR, so no local bypass or missing hook lets bad registry/architecture state
# reach main unnoticed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the main-branch source reference in the durable development ledger.
      - name: Record main-branch publication provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DNAOS_EVENT_KEY: github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:published
          DNAOS_EVENT_TYPE: github_published
          DNAOS_EVENT_STATUS: passed
          DNAOS_REPOSITORY: ${{ github.repository }}
          DNAOS_BRANCH: ${{ github.ref_name }}
          DNAOS_COMMIT_SHA: ${{ github.sha }}
          DNAOS_EVENT_SOURCE: github_actions
        run: npx tsx scripts/record-development-event.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Governance guards (registry sync, drift, dead code, duplicates, dependency graph, evidence isolation, registry stub check)
        run: bash scripts/pre-commit-check.sh

      # Dev Loop Pipeline (owner, 2026-08-05): scripts/watch-registry.ts + scripts/impact-analyzer.ts
      # write real pass/warning/fail verdicts and registry proposals to Supabase as the
      # AI edits files locally. This is the second, CI-side half of that loop — it blocks
      # the same way governance.sh above does if the latest verdict for any path is
      # 'fail' or a registry proposal is still pending Owner approval. See scripts/deploy-gate.ts.
      - name: Dev Loop Deploy Gate (blocks on Impact Analyzer fails / unapproved registry proposals)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/deploy-gate.ts

      # Append the final CI outcome under the same commit lineage. Secrets never
      # enter the event payload; the writer stores only references and hashes.
      - name: Record main-branch CI provenance
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DNAOS_EVENT_KEY: github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:ci
          DNAOS_EVENT_TYPE: github_ci_completed
          DNAOS_EVENT_STATUS: ${{ job.status }}
          DNAOS_REPOSITORY: ${{ github.repository }}
          DNAOS_BRANCH: ${{ github.ref_name }}
          DNAOS_COMMIT_SHA: ${{ github.sha }}
          DNAOS_EVENT_SOURCE: github_actions
        run: npx tsx scripts/record-development-event.ts
