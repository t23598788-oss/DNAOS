# Cloud Build: build image โดยส่ง NEXT_PUBLIC_* เป็น --build-arg
# แล้ว push ขึ้น Artifact Registry -> Cloud Run deploy ด้วย --image
#
# ก่อนใช้ครั้งแรก ต้องสร้าง Artifact Registry repo ก่อน (ครั้งเดียวต่อ project):
#   gcloud artifacts repositories create cloud-run-source-deploy \
#     --repository-format=docker \
#     --location=asia-southeast1 \
#     --description="Cloud Run images"
#
# วิธีรัน:
#   gcloud builds submit \
#     --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_SERVICE=dna-runtime,_GA_ID=G-XXXX,_LINE_URL=https://line.me/R/ti/p/@yourOA,_SB_URL=https://xxx.supabase.co,_SB_ANON=eyJ...

substitutions:
  _REGION: asia-southeast1
  _SERVICE: dna-runtime
  _GA_ID: ""
  _LINE_URL: ""
  _SB_URL: ""
  _SB_ANON: ""

steps:
  # 1) build image พร้อมส่ง build args
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg=NEXT_PUBLIC_GA_ID=${_GA_ID}'
      - '--build-arg=NEXT_PUBLIC_LINE_OA_URL=${_LINE_URL}'
      - '--build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SB_URL}'
      - '--build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SB_ANON}'
      - '-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:${SHORT_SHA}'
      - '-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:latest'
      - '.'

# ใช้ images: ให้ Cloud Build push ให้อัตโนมัติ (ไม่ต้องมี step push ซ้ำ)
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
